<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Learn With Fun - fun learning games for kids: Math, Science and English.">
    <title>Learn With Fun</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            color: #3D3A5C;
            background: linear-gradient(160deg, #6DD5FA 0%, #8EC5FC 50%, #C3B1FF 100%);
        }

        .card {
            width: 100%;
            max-width: 460px;
            background: #FFFFFF;
            border-radius: 28px;
            padding: 36px 28px;
            text-align: center;
            box-shadow: 0 16px 40px rgba(75, 59, 196, 0.25);
        }

        .emoji {
            font-size: 56px;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 2.2em;
            font-weight: 900;
            margin-bottom: 8px;
        }

        p {
            color: #6F6D8A;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .subjects {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 28px;
        }

        .chip {
            color: #FFFFFF;
            font-weight: 800;
            padding: 8px 16px;
            border-radius: 18px;
        }

        .math { background: linear-gradient(135deg, #FF6B6B, #FF8E53); }
        .science { background: linear-gradient(135deg, #4ECDC4, #44A08D); }
        .english { background: linear-gradient(135deg, #56C596, #3AA76D); }

        a.link {
            color: #6C5CE7;
            font-weight: 700;
        }

        footer {
            margin-top: 24px;
            font-size: 0.85em;
            color: #9A9AB0;
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="emoji">📚🎮✨</div>
        <h1>Learn With Fun</h1>
        <p>Fun learning games for kids aged 4–8: counting, spelling, rhyming, animals, planets and more.</p>
        <div class="subjects">
            <span class="chip math">Math</span>
            <span class="chip science">Science</span>
            <span class="chip english">English</span>
        </div>
        <a class="link" href="privacy-policy.html">Privacy Policy</a>
        <footer>© 2026 Learn With Fun · kinngshishupal</footer>
    </main>
</body>
</html>
